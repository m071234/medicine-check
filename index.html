<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#168653">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="お薬チェック">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>お薬チェック</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#17231d;background:#f4f7f5}
*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);min-height:100vh}
main{max-width:460px;margin:0 auto;padding:24px 0 36px}
header{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 22px}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:.02em}.tag{font-size:11px;color:#168653;background:#e2f3e9;padding:6px 10px;border-radius:999px;font-weight:700}
.datecard,.panel{background:white;border-radius:20px;padding:20px;box-shadow:0 4px 18px #173b2810}
.eyebrow{font-size:11px;color:#829087;font-weight:700;letter-spacing:.12em}
.date{font-size:25px;font-weight:800;margin-top:5px}.sub{font-size:13px;color:#829087;margin-top:5px}
.today{margin-top:14px;text-align:center;padding:24px 20px}
.status{font-size:19px;font-weight:800;margin:0 0 18px}
#take{width:158px;height:158px;border:0;border-radius:50%;background:#168653;color:white;font-size:19px;font-weight:800;box-shadow:0 9px 22px #16865335;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;margin:auto}
#take.done{background:#e4f3e9;color:#168653;box-shadow:none;border:2px solid #b8dfc5}
#take .symbol{font-size:42px;line-height:1}
.hint{font-size:12px;color:#829087;margin-top:14px}
.panel{margin-top:16px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h2{font-size:16px;margin:0}.small{font-size:12px;color:#829087}
.pill{font-size:11px;padding:5px 9px;border-radius:999px;background:#f0f2f1;color:#6e7c73;font-weight:700}
.pill.done{background:#e2f3e9;color:#168653}
.progressline{height:8px;background:#edf1ee;border-radius:20px;overflow:hidden;margin-top:10px}
#progress{height:100%;width:0;background:#168653;border-radius:20px;transition:width .2s}
.history{display:flex;flex-direction:column;gap:0}
.day{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid #eef1ef}
.day:first-child{border-top:0}.dayname{font-size:14px;font-weight:650}.daydate{font-size:11px;color:#829087;margin-top:3px}
.result{font-size:12px;font-weight:700;color:#829087}.result.yes{color:#168653}
.note{font-size:11px;line-height:1.7;color:#8a968e;text-align:center;margin:18px 8px}
button:focus-visible{outline:3px solid #91c9a6;outline-offset:4px}
</style>
</head>
<body>
<main>
<header><h1>お薬チェック</h1><span class="tag">MY DAILY LOG</span></header>
<section class="datecard">
 <div class="eyebrow">TODAY</div>
 <div class="date" id="todayDate"></div>
 <div class="sub">今日のお薬の服用記録</div>
</section>
<section class="datecard today">
 <p class="status" id="status">まだ飲んでいません</p>
 <button id="take" type="button" aria-pressed="false"><span class="symbol" id="symbol">＋</span><span id="buttonText">飲んだ！</span></button>
 <div class="hint" id="hint">飲んだらボタンをタップしてください</div>
</section>
<section class="panel">
 <div class="panelhead"><h2>今日の記録</h2><span class="pill" id="pill">未記録</span></div>
 <div class="small">服用状況 <strong id="count">0 / 1回</strong></div>
 <div class="progressline"><div id="progress"></div></div>
</section>
<section class="panel">
 <div class="panelhead"><h2>過去7日間の履歴</h2><span class="small">直近7日</span></div>
 <div class="history" id="history"></div>
</section>
<p class="note">記録はこの端末のブラウザ内に保存されます。アプリのデータやブラウザの履歴・サイトデータを消去すると、記録も消える場合があります。<br>このアプリは服用を促す通知や、服薬の安全性を判定する機能はありません。</p>
</main>
<script>
const KEY = "medicine-check-records-v1";
const weekdays = ["日","月","火","水","木","金","土"];
const dateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
function save(data){localStorage.setItem(KEY,JSON.stringify(data))}
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function render(){
 const now = new Date(), key = dateKey(now), records = load(), done = !!records[key];
 document.getElementById("todayDate").textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${weekdays[now.getDay()]}）`;
 document.getElementById("status").textContent = done ? "今日は服用済みです！" : "まだ飲んでいません";
 const btn = document.getElementById("take");
 btn.classList.toggle("done",done); btn.setAttribute("aria-pressed",String(done));
 document.getElementById("symbol").textContent = done ? "✓" : "＋";
 document.getElementById("buttonText").textContent = done ? "服用済み" : "飲んだ！";
 document.getElementById("hint").textContent = done ? "もう一度タップすると記録を取り消せます" : "飲んだらボタンをタップしてください";
 document.getElementById("pill").textContent = done ? "完了" : "未記録";
 document.getElementById("pill").classList.toggle("done",done);
 document.getElementById("count").textContent = done ? "1 / 1回" : "0 / 1回";
 document.getElementById("progress").style.width = done ? "100%" : "0%";
 const hist = document.getElementById("history"); hist.innerHTML = "";
 for(let i=0;i<7;i++){
   const d = new Date(now.getFullYear(),now.getMonth(),now.getDate()-i), k=dateKey(d), yes=!!records[k];
   const row=document.createElement("div"); row.className="day";
   const left=document.createElement("div"), name=document.createElement("div"), date=document.createElement("div"), result=document.createElement("div");
   name.className="dayname"; name.textContent=i===0?"今日":weekdays[d.getDay()]+"曜日";
   date.className="daydate"; date.textContent=`${d.getMonth()+1}月${d.getDate()}日`;
   left.append(name,date); result.className="result"+(yes?" yes":""); result.textContent=yes?"✓ 服用済み":"未記録";
   row.append(left,result); hist.append(row);
 }
}
document.getElementById("take").addEventListener("click",()=>{
 const data=load(), key=dateKey(new Date());
 if(data[key]) delete data[key]; else data[key]=true;
 save(data); render();
});
render();
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
